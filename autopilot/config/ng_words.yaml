# 薬機法・景品表示法の観点で避ける表現（正規表現）。
# 生成文に1つでも含まれていたら、その生成結果は不採用（次のLLM → テンプレへフォールバック）。
# 美容家電は「医薬品・医療機器ではない」前提で、効能・効果の断定や根拠のない最上級表現を禁止する。

patterns:
  - { re: "治る|治す|治療|完治|改善する|改善します", reason: "治療・改善の断定（医薬品的効能）" }
  - { re: "(シミ|シワ|たるみ|ニキビ|毛穴|くすみ|クマ).{0,6}(消え|消す|なくな|無くな|解消|撃退|除去)", reason: "肌悩みの解消を断定" }
  - { re: "若返", reason: "若返りの表現" }
  - { re: "アンチエイジング", reason: "老化防止の表現" }
  - { re: "痩せ|やせる|ダイエット効果|脂肪燃焼|脂肪を落と|デトックス", reason: "痩身効果の表現" }
  - { re: "永久脱毛|脱毛効果|毛が生えてこな", reason: "医療行為・効果の断定" }
  - { re: "発毛|育毛|薄毛.{0,4}(治|改善)", reason: "育毛・発毛効果" }
  - { re: "医療(レベル|級|用)|クリニック級|エステ級|サロン級|プロ級", reason: "医療・業務用と同等をうたう表現" }
  - { re: "副作用(が)?(ない|なし|無い)|安全性(が|は)?(高い|抜群)|肌に優しい|100%安全", reason: "安全性の保証" }
  - { re: "必ず|絶対|確実に|間違いなく", reason: "断定表現" }
  - { re: "効果(抜群|てきめん|絶大)|劇的|奇跡", reason: "誇大表現" }
  - { re: "日本一|世界一|業界初|業界No|ナンバーワン|最安", reason: "根拠のない最上級表現" }
  - { re: "No\\.?\\s?1(?!\\d)", reason: "根拠のないNo.1表示（投稿番号は3桁表記なので対象外）" }
  - { re: "今だけ|残りわずか|在庫限り|売り切れ必至", reason: "根拠のない限定・煽り表現" }
  - { re: "(\\d+)%\\s?(OFF|オフ|割引)", reason: "割引率の記載（データから算出していない数値）" }

# 投稿テキスト・キャプションに必ず含める表示
required:
  caption_prefix: "PR"
  price_disclaimer: "価格・ランキングは{date}時点（楽天市場調べ）。最新の価格は各ショップでご確認ください。"
