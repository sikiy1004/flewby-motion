# 対象ジャンル。rakuten_genre_id が空なら、初回の collect 時にキーワード検索の結果から自動で推定して DB に保存します。
# features: 商品名・説明文にキーワードが含まれていたら、そのラベルを「機能タグ」として表示（LLM に作らせない事実データ）。
# tips: 「選び方」投稿の本文（効能を断定しない表現で書くこと）。
# group: beauty（美容ガジェット）/ qol（暮らしが快適になる家電）。比率は settings.yaml の content.group_weights。
# stock_queries: 動画冒頭の実写背景（Pexels）の検索語（英語）。

genres:
  - key: hair_dryer
    label: ドライヤー
    group: beauty
    stock_queries: ["woman drying hair bathroom", "hair care morning routine"]
    keyword: ドライヤー
    rakuten_genre_id: null
    exclude: [ノズル, 替え, ケース, スタンド, ホルダー, 互換, 部品]
    hashtags: ["#ドライヤー", "#ヘアケア家電", "#ドライヤー比較"]
    features:
      大風量: 大風量
      速乾: 速乾
      マイナスイオン: マイナスイオン
      軽量: 軽量
      温冷: 温冷切替
      スカルプ: 頭皮モード
      折りたたみ: 折りたたみ
      低温: 低温モード
      静音: 静音
    tips:
      - { title: 風量をチェック, body: "乾かす時間を短くしたい人は「風量（㎥/分）」の数字を比較。髪が長い人ほど差が出やすいポイントです。" }
      - { title: 重さと持ちやすさ, body: "毎日使うものなので、本体の重さは要チェック。500g前後だと腕が疲れにくいと感じる人が多いです。" }
      - { title: 温度コントロール, body: "温風・冷風の切替や低温モードがあると、仕上げの手触りを調整しやすくなります。" }
      - { title: 収納と電源, body: "折りたたみやコードの長さも意外と大事。洗面所の収納スペースに合うか確認しておくと安心です。" }

  - key: hair_iron
    label: ヘアアイロン
    group: beauty
    stock_queries: ["woman styling hair mirror", "hair straightener styling"]
    keyword: ヘアアイロン
    rakuten_genre_id: null
    exclude: [替え, ケース, ポーチ, 互換, 部品]
    hashtags: ["#ヘアアイロン", "#ストレートアイロン", "#ヘアアイロン比較"]
    features:
      ストレート: ストレート
      カール: カール
      2way: 2WAY
      2WAY: 2WAY
      海外対応: 海外対応
      自動電源オフ: 自動オフ
      コードレス: コードレス
      チタン: チタンプレート
      セラミック: セラミック
    tips:
      - { title: 温度設定の幅, body: "細かく温度を選べるモデルは、髪質や仕上がりに合わせて調整しやすいのが魅力です。" }
      - { title: プレートの素材と幅, body: "前髪や短い髪には細め、ロングには幅広プレートが扱いやすい傾向があります。" }
      - { title: 安全機能, body: "自動電源オフ機能があると、切り忘れが心配な朝でも安心です。" }
      - { title: 持ち運び, body: "旅行が多い人は海外対応やコードレスかどうかもチェック。" }

  - key: facial_device
    label: 美顔器
    group: beauty
    stock_queries: ["skincare routine mirror", "woman skincare bathroom"]
    keyword: 美顔器
    rakuten_genre_id: null
    exclude: [ジェル, 替え, 交換, 互換, 部品, 化粧水]
    hashtags: ["#美顔器", "#おうち美容", "#美容家電"]
    features:
      EMS: EMS
      RF: RF（ラジオ波）
      LED: LED
      イオン導入: イオン導入
      温冷: 温冷
      防水: 防水
      コードレス: コードレス
      リフト: リフトケアモード
    tips:
      - { title: 機能で選ぶ, body: "EMS・RF・LED・イオン導入など、搭載機能はモデルごとに違います。やりたいケアに合う機能があるか確認しましょう。" }
      - { title: 続けやすさ, body: "1回あたりの使用時間や、お風呂で使える防水タイプかどうかで「続けやすさ」が変わります。" }
      - { title: 専用ジェルのコスト, body: "専用ジェルが必要なモデルは、本体価格＋消耗品のランニングコストで比べるのがおすすめ。" }
      - { title: 肌に合うか, body: "肌が敏感な人は、レベル調整の細かさや使用上の注意を事前に公式サイトで確認しておくと安心です。" }

  - key: epilator
    label: 家庭用光美容器
    group: beauty
    stock_queries: ["body care bathroom", "self care routine woman"]
    keyword: 光美容器
    rakuten_genre_id: null
    exclude: [ジェル, 替え, カートリッジ単品, 互換, 部品, サングラス]
    hashtags: ["#光美容器", "#セルフケア", "#美容家電"]
    features:
      冷却: 冷却機能
      連射: 連続照射
      カートリッジ: カートリッジ交換式
      VIO: VIO対応
      顔: 顔対応
      コードレス: コードレス
      照射レベル: 照射レベル調整
    tips:
      - { title: 照射回数とランニングコスト, body: "本体価格だけでなく、カートリッジの照射回数や交換費用まで含めて比較しましょう。" }
      - { title: 使える部位, body: "顔・VIOなど、使える部位はモデルごとに異なります。取扱説明書の対応部位を必ず確認。" }
      - { title: 痛み対策の機能, body: "冷却機能や照射レベルの細かさは、使い心地に関わるチェックポイントです。" }
      - { title: 1回の所要時間, body: "連続照射や照射面の広さで、全身ケアにかかる時間が変わります。" }

  - key: toothbrush
    label: 電動歯ブラシ
    group: beauty
    stock_queries: ["morning routine bathroom", "brushing teeth mirror"]
    keyword: 電動歯ブラシ
    rakuten_genre_id: null
    exclude: [替えブラシ, 替え, 交換, 互換, 部品, スタンド]
    hashtags: ["#電動歯ブラシ", "#オーラルケア", "#電動歯ブラシ比較"]
    features:
      音波: 音波式
      回転: 回転式
      充電式: 充電式
      防水: 防水
      タイマー: タイマー
      圧力センサー: 圧力センサー
      アプリ: アプリ連携
      USB: USB充電
    tips:
      - { title: 方式の違い, body: "音波式・回転式など、方式によって磨き心地が違います。好みに合わせて選びましょう。" }
      - { title: 替えブラシの価格, body: "長く使うものなので、替えブラシの価格と入手しやすさも比較ポイント。" }
      - { title: 便利機能, body: "タイマーや圧力センサーがあると、磨きすぎ・時間不足を防ぎやすくなります。" }
      - { title: 充電と持ち運び, body: "USB充電やケース付きのモデルは出張・旅行にも便利です。" }

  - key: body_scale
    label: 体組成計
    group: beauty
    stock_queries: ["healthy morning routine", "woman fitness home"]
    keyword: 体組成計
    rakuten_genre_id: null
    exclude: [電池, 替え, 互換, 部品, マット]
    hashtags: ["#体組成計", "#スマート家電", "#セルフケア"]
    features:
      Bluetooth: Bluetooth
      アプリ: アプリ連携
      Wi-Fi: Wi-Fi
      体脂肪: 体脂肪率
      筋肉量: 筋肉量
      内臓脂肪: 内臓脂肪レベル
      薄型: 薄型
      充電式: 充電式
    tips:
      - { title: アプリ連携, body: "スマホに自動で記録されるモデルなら、記録の手間がゼロで続けやすくなります。" }
      - { title: 測れる項目, body: "体脂肪率・筋肉量など、測定できる項目の数はモデルごとに違います。" }
      - { title: 家族で使うなら, body: "登録できる人数や自動で人を判別する機能があるかもチェック。" }
      - { title: 置き場所, body: "薄型・軽量だと出し入れしやすく、毎日乗る習慣をつけやすいです。" }

  # ---------------- 暮らしの質が上がる家電（QOL） ----------------
  - key: humidifier
    label: 加湿器
    group: qol
    stock_queries: ["cozy bedroom winter morning", "humidifier steam room"]
    keyword: 加湿器
    rakuten_genre_id: null
    exclude: [フィルター, 替え, 交換, カートリッジ, 互換, 部品, 抗菌剤]
    hashtags: ["#加湿器", "#暮らしを整える", "#QOL爆上がり"]
    features:
      ハイブリッド: ハイブリッド式
      スチーム: スチーム式
      超音波: 超音波式
      気化式: 気化式
      上部給水: 上部給水
      大容量: 大容量
      静音: 静音
      アロマ: アロマ対応
      タイマー: タイマー
      湿度センサー: 湿度センサー
    tips:
      - { title: 加湿方式を知る, body: "スチーム・気化・超音波・ハイブリッドで、電気代や手入れのしやすさが変わります。置く部屋と使い方で選びましょう。" }
      - { title: 適用畳数をチェック, body: "部屋の広さに対して余裕のある「適用畳数」のモデルを選ぶと、物足りなさを感じにくくなります。" }
      - { title: 給水と手入れ, body: "上部給水やパーツの少なさは、毎日使い続けられるかに直結するポイントです。" }
      - { title: 寝室なら運転音, body: "寝室で使うなら静音モードやライトの消灯機能があると快適です。" }

  - key: futon_dryer
    label: 布団乾燥機
    group: qol
    stock_queries: ["cozy bed morning sunlight", "making bed bedroom"]
    keyword: 布団乾燥機
    rakuten_genre_id: null
    exclude: [ホース, 替え, 交換, 互換, 部品, マット単品]
    hashtags: ["#布団乾燥機", "#暮らしを整える", "#QOL爆上がり"]
    features:
      マット不要: マット不要
      マットなし: マット不要
      靴: 靴乾燥
      衣類: 衣類乾燥
      ダブルノズル: ダブルノズル
      タイマー: タイマー
      コンパクト: コンパクト
      温風: 温風
    tips:
      - { title: マットの有無, body: "マット不要タイプは準備と片付けがラク。毎日気軽に使いたい人に向いています。" }
      - { title: ノズルの数, body: "ダブルノズルなら2組の布団を同時に温められるので、家族で使うときに便利です。" }
      - { title: プラスαの使い道, body: "靴や衣類の乾燥に使えるモデルは、雨の日や部屋干しのときにも出番があります。" }
      - { title: 置き場所, body: "コンパクトさや収納のしやすさも、出しっぱなしにしないために大事なポイントです。" }

  - key: massager
    label: マッサージ器
    group: qol
    stock_queries: ["relaxing evening sofa", "self care relax home"]
    keyword: ネックマッサージャー
    rakuten_genre_id: null
    exclude: [替え, 交換, カバー単品, 互換, 部品]
    hashtags: ["#マッサージ器", "#おうち時間", "#セルフケア"]
    features:
      ヒーター: ヒーター付き
      温め: ヒーター付き
      コードレス: コードレス
      もみ玉: もみ玉
      首: 首用
      肩: 肩用
      充電: 充電式
      強さ: 強さ調整
    tips:
      - { title: 使う部位で選ぶ, body: "首・肩・足など、どこに使いたいかで形が大きく違います。まず使う場面をイメージしましょう。" }
      - { title: 温め機能, body: "ヒーター付きのモデルは、寒い季節のリラックスタイムにうれしい機能です。" }
      - { title: コードの有無, body: "コードレスならソファでも寝室でも使えて、出番が増えやすくなります。" }
      - { title: 使用上の注意, body: "使用時間や体調に関する注意は、購入前に取扱説明書で必ず確認しておきましょう。" }

  - key: smart_watch
    label: スマートウォッチ
    group: qol
    stock_queries: ["woman checking smartwatch", "morning run city"]
    keyword: スマートウォッチ
    rakuten_genre_id: null
    exclude: [バンド, ベルト, 保護, フィルム, ケース, 充電器, 互換]
    hashtags: ["#スマートウォッチ", "#ガジェット好き", "#QOL爆上がり"]
    features:
      心拍: 心拍計測
      睡眠: 睡眠記録
      GPS: GPS
      防水: 防水
      通知: スマホ通知
      Suica: Suica対応
      着信: 着信通知
      長時間: 長時間バッテリー
    tips:
      - { title: 何を記録したい？, body: "歩数・心拍・睡眠など、記録できる項目はモデルごとに違います。続けたい習慣から選ぶのがコツ。" }
      - { title: バッテリーの持ち, body: "充電の手間は続けやすさに直結します。毎日充電できるかで選び方が変わります。" }
      - { title: スマホとの相性, body: "iPhone・Android どちらに対応しているか、専用アプリの使いやすさもチェックしておきましょう。" }
      - { title: 見た目とサイズ, body: "毎日つけるものなので、文字盤の大きさや服装との合わせやすさも大事です。" }

  - key: electric_blanket
