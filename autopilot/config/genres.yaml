    group: qol
    stock_queries: ["cozy blanket winter home", "warm living room winter"]
    keyword: 電気毛布
    rakuten_genre_id: null
    exclude: [カバー単品, 替え, 互換, 部品]
    hashtags: ["#電気毛布", "#冬支度", "#おうち時間"]
    features:
      洗える: 丸洗いOK
      丸洗い: 丸洗いOK
      タイマー: タイマー
      掛け敷き: 掛け敷き兼用
      ひざ掛け: ひざ掛け
      室温センサー: 室温センサー
      ダブル: ダブルサイズ
      USB: USB給電
    tips:
      - { title: 掛けるか敷くか, body: "掛け敷き兼用なら、季節や好みで使い方を変えられます。" }
      - { title: 洗えるかどうか, body: "肌に触れるものなので、丸洗いできるかは清潔に使い続けるための大事なポイントです。" }
      - { title: タイマーと温度調整, body: "切り忘れ防止のタイマーや、細かい温度調整があると安心して使えます。" }
      - { title: サイズ, body: "ひざ掛け・シングル・ダブルなど、使う場所に合わせてサイズを選びましょう。" }

