# ============================================================
#  BGM リスト（ここに書いた曲から、投稿の雰囲気に合わせて自動で選曲します）
# ============================================================
# ▼ 使える曲の条件（重要）
#   - 「商用利用可」で、SNS（Instagram / TikTok）での利用が規約上 OK な曲だけを置いてください。
#   - J-POP・アニメ曲・Instagram/TikTok アプリ内の流行曲は、API からの自動投稿では使えません
#     （権利処理されていないため、ミュート・削除・アカウント制限の原因になります）。
#   - 探し方の例: DOVA-SYNDROME / 甘茶の音楽工房 / Pixabay Music など（各サイト・各曲の規約を必ず確認）。
#     「人気順」「再生数順」で並べ、テンポの良い曲（BPM 100〜130）を選ぶと、流行っぽい雰囲気になります。
#
# ▼ 書き方
#   file:   assets/bgm/ からの相対パス（例: upbeat/pop_morning.mp3）
#   mood:   upbeat（ランキング・価格帯）/ cute（注目モデル）/ chill（選び方）
#   start:  曲の一番盛り上がる位置（秒）。冒頭から盛り上がる部分を使うと離脱が減ります
#   credit: クレジット表記が必要な曲だけ書く（例: "BGM: 曲名 by 作者名 (DOVA-SYNDROME)"）。不要なら null
#
# ▼ 曲ファイルを置くだけでも動きます（フォルダ名 upbeat / cute / chill を mood として扱い、クレジット不要扱い）

